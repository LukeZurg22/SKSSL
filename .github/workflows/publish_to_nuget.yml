name: Publish to NuGet

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore --no-incremental

      - name: Test
        run: dotnet test --configuration Release --no-build

#      - name: Pack SKSSL.Engine
#        run: dotnet pack SKSSL/SKSSL.Engine.csproj
#          --configuration Release
#          --no-build
#          --output ./nupkgs

      - name: Pack
        run: dotnet pack SKSSL/SKSSL.csproj
            --configuration Release
            --no-build
            --output ./nupkg
            -p:PackageVersion=${{ github.ref_name }}

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate